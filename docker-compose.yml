services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: demo:local
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      TZ: Asia/Seoul
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USER}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_PROMPT: ${GEMINI_PROMPT}
      JWT_SECRET: ${JWT_SECRET}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      CHATBOT_MODE: ${CHATBOT_MODE:-simple}
      CHATBOT_BASE_URL: ${CHATBOT_BASE_URL:-http://ai:8000}
      DORMANT_DAYS: ${DORMANT_DAYS:-7}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      REPORT_ADMIN_EMAIL: ${REPORT_ADMIN_EMAIL:-raon.bssm@gmail.com}
      POST_REVIEW_ASYNC: ${POST_REVIEW_ASYNC:-false}
      POST_UPLOAD_LIMIT_ENABLED: ${POST_UPLOAD_LIMIT_ENABLED:-false}


