name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: tikitaka
          POSTGRES_USER: raon
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raon -d tikitaka"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/tikitaka
      SPRING_DATASOURCE_USERNAME: raon
      SPRING_DATASOURCE_PASSWORD: test
      JWT_SECRET: dGVzdC1vbmx5LWp3dC1zZWNyZXQtZm9yLWNpLWJ1aWxkLTEyMzQ1Ng==
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: ap-northeast-2
      AWS_S3_BUCKET_NAME: test-bucket
      GEMINI_API_KEY: test
      GEMINI_PROMPT: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Build Docker image
        run: docker build -t tikitaka-server:${{ github.sha }} .
