spring:
  application:
    name: tikitaka
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      region:
        static: ${AWS_REGION}
server:
  port: 8090

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET_NAME}

gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-3.1-flash-lite
  prompt: ${GEMINI_PROMPT}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:1800000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}
  signup-token-expiration: ${JWT_SIGNUP_EXPIRATION:600000}

ranking:
  base-multiplier: 67.76      # K — 개인 점수 = round(AI점수 × K)
  min-team-size: 5            # 조정치 분모의 하한
  dormant-days: 7             # 휴면 전환 기준 일수

season:
  round-days: 7               # 라운드 1개 길이
  rounds-per-season: 4        # 시즌당 라운드 수 → 시즌 = 28일
  prefetch-days: 30           # 미래 라운드를 며칠치 미리 생성할지
  match-open-ahead-days: 1    # 매치·게시판을 라운드 시작 며칠 전에 만들지
