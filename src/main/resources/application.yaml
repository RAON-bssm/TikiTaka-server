spring:
  application:
    name: tikitaka
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
      
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

  # 신고 알림 메일(Gmail SMTP). 계정이 비어 있어도 기동은 되고 발송만 건너뛴다
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}   # Gmail 앱 비밀번호. 여기에 직접 쓰지 말 것
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      region:
        static: ${AWS_REGION}
server:
  port: 8090

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET_NAME}

gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-3.1-flash-lite
  prompt: ${GEMINI_PROMPT}

chatbot:
  mode: ${CHATBOT_MODE:simple}   # simple = 페르소나 챗봇, rag = 벡터DB 검색형. 구현체를 고른다
  base-url: ${CHATBOT_BASE_URL:http://ai:8000}
  connect-timeout: 3s
  read-timeout: 120s        # 로컬 LLM은 느리다. 기본값이면 앱이 먼저 끊긴다
  history-turns: 10         # AI 서버에 실어 보낼 지난 대화 턴 수 (한 턴 = 질문 + 답변)

apple:
  client-id: ${APPLE_CLIENT_ID}   # identity token의 aud와 비교할 앱 번들 ID
  # 아래 3개는 탈퇴 시 Apple 연동 해지(revoke)용. 비어 있어도 기동은 되고, Apple 유저 탈퇴만 500으로 실패한다
  team-id: ${APPLE_TEAM_ID:}         # Apple Developer Team ID
  key-id: ${APPLE_KEY_ID:}           # Sign in with Apple 키의 Key ID
  private-key: ${APPLE_PRIVATE_KEY:} # .p8 파일 내용 그대로 (BEGIN/END 줄 포함)

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:1800000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}
  signup-token-expiration: ${JWT_SIGNUP_EXPIRATION:600000}

ranking:
  base-multiplier: 67.76      # K — 개인 점수 = round(AI점수 × K)
  min-team-size: 5            # 조정치 분모의 하한
  dormant-days: ${DORMANT_DAYS:7}   # 휴면 전환 기준 일수 (개발 환경은 DORMANT_DAYS로 크게 잡는다)
  point-divisor: 20           # 게시물 작성 포인트 = round(AI점수 × K ÷ point-divisor)

season:
  round-days: 7               # 라운드 1개 길이
  rounds-per-season: 4        # 시즌당 라운드 수 → 시즌 = 28일
  prefetch-days: 30           # 미래 라운드를 며칠치 미리 생성할지
  match-open-ahead-days: 1    # 매치·게시판을 라운드 시작 며칠 전에 만들지


report:
  admin-email: ${REPORT_ADMIN_EMAIL:raon.bssm@gmail.com}   # 신고 알림 메일 수신자

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

